[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "norwegian-company-agent"
version = "0.1.0"
description = "Norwegian Company Intelligence Agent — Competition Ready"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI Engineering Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "google-genai>=1.0.0",
    "browser-use>=0.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
company-agent = "company_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/company_agent"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
